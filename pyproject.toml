[project]
name = "clms-essay-archive"
version = "0.10.2"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "mcp>=1.12,<2", "pillow>=11,<13", "pypdfium2>=4.30,<6", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "playwright>=1.50,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
