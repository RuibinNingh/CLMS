# Replace the hostname/certificate paths; HTTPS certificate issuance is outside this file.
server {
    listen 443 ssl;
    server_name essays.example.com;
    ssl_certificate /etc/letsencrypt/live/essays.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/essays.example.com/privkey.pem;
    client_max_body_size 101m;
    location / {
        proxy_pass http://127.0.0.1:8472;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
